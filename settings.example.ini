; TriExplorer portable configuration
; Copy to settings.ini, or launch once to generate settings.ini automatically.
; settings.ini is shared by KH24 and KHzz when launching from the mapped project folder.
; Restart the application after editing these values.

[app]
name=TriExplorer

[cache]
; auto = %LOCALAPPDATA%/TriExplorer/folder-sizes.sqlite3 on Windows.
; Specify an absolute path or path relative to the project folder to override.
; Browsing SHA hashes and recursive folder sizes share this SQLite database.
sqlite_path=auto

[network]
; A SINGLE DIRECTORY NAME at the root of each SMB share (e.g. Z:).
; This is deliberately not an arbitrary absolute path: moves must stay on the
; same share to remain fast and recoverable. Changing this setting does NOT
; move previously recycled items; switch back to recover those.
trash_name=.TriExplorer-Recycle

; All other window, pane, sort, pinned-folder and view preferences are
; automatically appended to settings.ini by the application.
