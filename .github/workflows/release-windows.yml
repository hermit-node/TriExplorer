name: TriExplorer portable Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-windows.yml"

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_VERSION: ${{ github.event.inputs.version || '0.1.0' }}
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.22,<7"
      - name: Regression tests
        shell: pwsh
        run: |
          python -B test_explorer.py
      - name: Build portable executable
        shell: pwsh
        run: |
          python -B build_portable.py --version "$env:RELEASE_VERSION"
      - name: Verify release archive and checksums
        shell: pwsh
        run: |
          $zip = "dist/TriExplorer-v$env:RELEASE_VERSION-win64.zip"
          if (!(Test-Path $zip)) { throw "Portable ZIP missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $files = @($archive.Entries | ForEach-Object { $_.Name })
            $expected = @("TriExplorer.exe","settings.ini","TriExplorer.sqlite3")
            if (@(Compare-Object $files $expected).Count) { throw "Unexpected release files: $($files -join ', ')" }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ascii -Path "dist/SHA256SUMS.txt"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $zip = "dist/TriExplorer-$tag-win64.zip"
          $notes = "Portable Windows x64 build. Extract TriExplorer.exe, settings.ini and TriExplorer.sqlite3 into the same writable directory; no Python installation required. Preferences and cache remain in that directory."
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create $tag $zip "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "TriExplorer $tag (Windows portable)" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
